# NATS configuration for plugNmeet on Railway.
# Based on nats_server_sample.conf. The $PNM_NATS_* values come from Railway
# service variables; NATS resolves undefined config variables from the environment.

# Client connections from plugnmeet-server over Railway's private network.
# Listening on [::] accepts both IPv6 and IPv4.
listen: "[::]:4222"

# Browsers connect here through the service's public Railway domain.
websocket {
    host: "::"
    port: 8222
    no_tls: true
}

jetstream {
    store_dir: /data/jetstream
}

accounts {
    SYS: {
        exports: [
            {
                stream: "$SYS.ACCOUNT.PNM.>",
                accounts: [PNM]
            }
        ]
    }
    PNM: {
        jetstream: enabled
        imports: [
            {
                stream: {
                    account: SYS, subject: "$SYS.ACCOUNT.PNM.>"
                }
            }
        ]
        users: [
            {
                nkey: $PNM_NATS_USER_PUBLIC
            }
        ]
    }
}

system_account: SYS

authorization {
    timeout: 5
    auth_callout {
        issuer: $PNM_NATS_ISSUER_PUBLIC
        auth_users: [ $PNM_NATS_USER_PUBLIC ]
        account: PNM
        xkey: $PNM_NATS_XKEY_PUBLIC
    }
}
